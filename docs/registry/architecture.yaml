# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: state_machine_atomicity
    status: active
    api: "Generational lock ID (int counter incremented per transition) + call_deferred discipline for all subscriber re-entry paths"
    not: "Mutex (rejected — requires Q-A4 spike validation; API friction without immediate benefit); Pure call_deferred frame-boundary lock (rejected — 16.6ms per transition delay; Pillar 3 ritual hiccup)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    reason: "Works identically in single-thread (Godot 4.6 WASM default) AND COOP/COEP threaded modes. Future-proofs Q-A4 without immediate Mutex overhead. Per-transition fallback timer (NOT global) prevents cross-transition unlock bug. (Contract 1)"
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - purpose: transition_id_generation
    status: active
    api: 'String format: "%d_%d_%s_%s" % [wall_clock_ms, persisted_counter, from, to]; counter persisted in user://state.json[_transition_id_counter]; backend UNIQUE constraint on full string'
    not: "OS.get_unique_id()-seeded UUID (rejected — long string, VARCHAR backend column); Backend-allocated transition_id (rejected — offline mode fails closed, Pillar 2 violation)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    reason: "Collision-safe across WASM reload (counter persisted), NTP clock drift (counter portion guarantees uniqueness), and cross-device handoff (UNIQUE constraint catches rare overlap). Forward-recovery MUST reuse tombstone's transition_id verbatim — never regenerate. (Contract 2)"
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - purpose: payload_serialization_envelope
    status: active
    api: "SerializableResource base class with to_dict() / from_dict(Dictionary) methods; explicit per-class schema; tombstone stores payload as Dictionary"
    not: "var_to_bytes + base64 (rejected — opaque blob in IndexedDB devtools, debug-hostile); Dictionary throughout dropping Resource type (rejected — lose BossOutcome enum type-checking, AC-11a string-compare with no IDE warning)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    reason: "Resource type preserved in code (type-safety + IDE auto-complete) but persistence boundary uses explicit JSON-serializable Dictionary. Per-class boilerplate (~5-10 lines) is one-time cost; debug-readability benefit is permanent. (Contract 3)"
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - purpose: payload_type_tagging
    status: active
    api: "payload.get_script().get_global_name() — returns registered class_name (e.g., 'BossPayload')"
    not: "Object.get_class() (FORBIDDEN — returns engine class 'Resource', silently breaks forward-recovery; all payloads round-trip to null)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    reason: "Godot 4.6 Object.get_class() returns engine class, NOT GDScript class_name. The get_script().get_global_name() API is the correct way to retrieve the registered class_name string for type-tag-based deserialization. (Contract 3 — godot-specialist BLOCKING #2 fix)"
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - purpose: deferred_re_entry_pattern
    status: active
    api: "get_tree().process_frame.connect(lambda, CONNECT_ONE_SHOT) — lambda captures event by value at connect time"
    not: "Callable.call_deferred(event) — preferred-idiom violation; CI warning (not failure) pending Q-A4 spike; variadic-arg resolution under typed-resource contexts ambiguous in 4.5+"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    reason: "process_frame signal fires at next frame's top — deterministic ordering. CONNECT_ONE_SHOT guarantees one-time invocation. Lambda wrapping bypasses variadic-args ambiguity (Contract 5). VS spike may downgrade this to 'either pattern acceptable' if Godot 4.6 verified equivalent."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - purpose: loot_rarity_rng_seeded_on_transition_id
    status: active
    api: "RandomNumberGenerator.new() with seed = hash(transition_id) for loot rarity RNG roll"
    not: "randf() global; any RNG not seeded on transition_id (breaks replay safety and idempotency)"
    adr: docs/architecture/adr-0005-loot-rarity-formula.md
    reason: "ADR-006 Contract 2 establishes transition_id as the unique per-workout identifier. Seeding RNG on this ensures: (1) same workout_completed event always produces same loot tier; (2) forward-recovery after page reload doesn't re-roll loot; (3) unit tests can predict exact output. Godot-specialist confirmed RandomNumberGenerator.seed is stable API in 4.6."
    referenced_by:
      - docs/architecture/adr-0005-loot-rarity-formula.md
    added: 2026-05-27
    revised: ""

  - purpose: relative_urls_in_http_request
    status: active
    api: "Godot HTTPRequest uses relative URL paths (e.g., \"/api/game/state\") — NOT absolute URLs with domain"
    not: "Absolute URLs (e.g., \"https://rcprohk.com/api/game/state\") — FORBIDDEN: hard-codes domain, breaks dev↔prod parity when running on localhost, requires environment-based config"
    adr: docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    reason: "Browser fetch() resolves relative URLs against window.location.origin — same URL works on both http://localhost/ (dev) and https://rcprohk.com/ (prod) without any config change. Absolute URLs require an environment variable or build flag to switch. Godot specialist confirmed relative URL resolution works in Web Export 4.6."
    referenced_by:
      - docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    added: 2026-05-27
    revised: ""

  - purpose: gymsys_api_router_prefix
    status: active
    api: "All Mirror Hero game endpoints in GymSys FastAPI use APIRouter(prefix=\"/api/game\"). No game endpoint may use studiosys namespace (/api/students/, /api/classes/, /api/bookings/, /api/company/)"
    not: "Ad-hoc route registration at / or /api/ root — causes namespace collision with studiosys existing routes"
    adr: docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    reason: "FastAPI APIRouter prefix ensures all game endpoints are grouped, easily mockable, and impossible to collide with studiosys. TD-ADR ruling: enforce at Python architecture layer, not just convention."
    referenced_by:
      - docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    added: 2026-05-27
    revised: ""

  - purpose: http_request_per_channel
    status: active
    api: "One orphan HTTPRequest node per channel (poll, state_write, loot_cache, loot_commit); single in-flight per channel; add_child() to autoload root; queue_free() after request_completed fires (call_deferred for safety)"
    not: "HTTPRequest pool (rejected — shared channel node reuse creates state pollution); single HTTPRequest node for all channels (rejected — concurrent requests block each other)"
    adr: docs/architecture/adr-0002-gymsys-integration-protocol.md
    reason: "4 concurrent HTTPRequest nodes are well within browser HTTP/1.1 connection limit (~6 per host). Per-channel isolation means one slow write cannot block poll cadence. Orphan + queue_free is Godot 4.x idiomatic pattern for fire-and-forget HTTP; avoids node lifecycle management overhead. (godot-specialist CONFIRM)"
    referenced_by:
      - docs/architecture/adr-0002-gymsys-integration-protocol.md
    added: 2026-05-26
    revised: ""

  - purpose: subviewport_oversample
    status: active
    api: "Code-set SubViewport.size = display_size * Vector2(1.05, 1.05) in _ready() and on viewport resize signal"
    not: "SubViewport.stretch_shrink = 1.05 — FORBIDDEN: stretch_shrink is an integer property in Godot 4.x; float value 1.05 silently truncates to 1 (no effect). This was confirmed as a BLOCKING bug by godot-specialist during ADR-0001 review."
    adr: docs/architecture/adr-0001-web-export-budget-caps.md
    reason: "5% pixel bleed buffer at GameLayer viewport edges prevents black-border clipping during maximum shake displacement (±MAX_OFFSET_PX = 4.0px). Code-set approach works for both initial size and dynamic viewport resize (orientation change). ADR-0001 BLOCKING fix ratified."
    referenced_by:
      - docs/architecture/adr-0001-web-export-budget-caps.md
      - design/gdd/screen-effects-system.md   # Rule 14 Viewport Oversample section
    added: 2026-05-26
    revised: ""

  - purpose: private_mode_detect_and_gate
    status: active
    api: "PersistenceLayer._detect_storage_mode() — FileAccess.open() probe file at boot; null return = Private Mode; StorageMode.PRIVATE activates in-memory fallback + emits private_mode_detected() signal"
    not: "Silent in-memory fallback without user notification (FORBIDDEN — silent LootDrop loss violates Pillar 3); localStorage polyfill for Private Mode (FORBIDDEN — banned by window_local_storage pattern + additional maintenance burden)"
    adr: docs/architecture/adr-0003-save-state-strategy.md
    reason: "Detect-and-gate is the only Pillar 3-compliant response to Private Mode. User explicitly chose Private Mode = user opted out of persistence. Non-dismissable banner + loot grant disable communicates the consequence honestly. Silent loss with localStorage polyfill would create a false sense of safety (5MB cap + same ITP eviction anyway). TD-ADR ruling."
    referenced_by:
      - docs/architecture/adr-0003-save-state-strategy.md
    added: 2026-05-26
    revised: ""

  - purpose: mobile_ua_detection
    status: active
    api: "PlatformDetect autoload (src/autoload/platform_detect.gd) — is_mobile_web: bool set once via JavaScriptBridge.eval('navigator.userAgent') on Web target"
    not: "Direct JavaScriptBridge.eval() calls in any file other than platform_detect.gd — FORBIDDEN (CI enforced via check_platform_detect_callers.gd)"
    adr: docs/architecture/adr-0001-web-export-budget-caps.md
    reason: "Wrapping JavaScriptBridge in a single autoload makes Foundation autoloads testable on desktop editor (is_mobile_web defaults false when OS.get_name() != 'Web'). Prevents browser UA detection logic from spreading across codebase. TD-ADR ruling: single PlatformDetect source of truth."
    referenced_by:
      - docs/architecture/adr-0001-web-export-budget-caps.md
    added: 2026-05-26
    revised: ""

  - purpose: telemetry_dedicated_http_channel
    status: active
    api: "Telemetry owns its OWN orphan HTTPRequest node (a 5th channel) created in the telemetry autoload, SEPARATE from #2 GymSysBackendClient's 4-channel MAX_INFLIGHT_REQUESTS=4 pool (poll/state_write/loot_cache/loot_commit). Single in-flight per telemetry channel; own backoff (Formula 5); lowest priority."
    not: "Reuse #2's HTTP path / share #2's MAX_INFLIGHT pool (FORBIDDEN — a telemetry batch could occupy a slot and delay a gameplay-critical loot_commit / state_write → Pillar 3 risk + telemetry.md Rule 1 pure-observer violation over the wire)"
    adr: docs/architecture/adr-0012-telemetry-data-pipeline-privacy.md
    reason: "Keeps the observer one-directional at the transport layer. 4 (#2) + 1 (telemetry) = 5 concurrent HTTPRequest, within ~6-per-host HTTP/1.1 limit (same headroom analysis as ADR-0002 http_request_per_channel). Telemetry being isolated means a slow/failed telemetry flush can never starve gameplay channels."
    referenced_by:
      - docs/architecture/adr-0012-telemetry-data-pipeline-privacy.md
    added: 2026-06-12
    revised: ""

  - purpose: telemetry_beacon_token_in_body
    status: active
    api: "Page-hide flush uses navigator.sendBeacon('/api/game/telemetry/beacon', blob) via platform_detect.send_beacon(url, body)->bool seam; auth session_token travels IN THE REQUEST BODY (separate endpoint from the X-Session-Token-header main flush). send_beacon false → synchronous best-effort XHR fallback (EC-18)."
    not: "navigator.sendBeacon with X-Session-Token header (IMPOSSIBLE — browser sendBeacon API cannot set custom headers; header is silently dropped → unauthenticated request); raw JavaScriptBridge.eval in telemetry.gd (FORBIDDEN — ADR-0001 raw_javascript_bridge_eval, must go through platform_detect seam)"
    adr: docs/architecture/adr-0012-telemetry-data-pipeline-privacy.md
    reason: "sendBeacon cannot attach custom headers, so token-in-body on a dedicated /beacon endpoint is the standard workaround — kept separate so the main flush path stays header-authed. Same-origin (ADR-0004) means no cross-site exfil; append-only de-identified events with UNIQUE dedup = no privilege escalation. Raw JS confined to platform_detect.gd per ADR-0001."
    referenced_by:
      - docs/architecture/adr-0012-telemetry-data-pipeline-privacy.md
    added: 2026-06-12
    revised: ""

