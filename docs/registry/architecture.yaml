# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-06-12"
# 2026-05-26: ADR-0001 Web Export Budget Caps (Proposed) — appended CanvasLayer topology state_ownership + PlatformDetect interface + 2 performance_budgets + 2 api_decisions + 1 forbidden_pattern
# 2026-06-12: ADR-0012 Telemetry Data Pipeline & Privacy (Accepted-contract) — appended gymsys_telemetry_api interface + telemetry_dedicated_http_channel + telemetry_beacon_token_in_body api_decisions (additive to ADR-0002 /api/game/ topology; zero conflict with existing stances)

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: current_state
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0006-state-machine-contract.md
    interface: "GameStateMachine.current_state (read-only String; stable lowercase keys: booting / disconnected / idle / workout_active / rest_period / combat_active / boss_encounter / loot_drop / suspended)"
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - state: pending_transition
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0006-state-machine-contract.md
    interface: "Dictionary persisted at user://state.json['pending_transition']; SerializableResource payload via to_dict/from_dict envelope (Contract 3); transition_id format opaque per Contract 2"
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - state: loot_pending_authoritative_timestamp
    status: active
    owner_system: gymsys-backend
    adr: docs/architecture/adr-0006-state-machine-contract.md
    interface: "pending_since_server INT (unix) set at POST /lootdrop/{transition_id}:loot-cache/cache; client mirror loot_pending.pending_since is NON-authoritative — used only for offline-mode UX (Contract 15)"
    write_access: gymsys-backend-only
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
      - docs/architecture/adr-0002-gymsys-integration-protocol.md  # ratifies endpoint + table schema
    added: 2026-05-25
    revised: "2026-05-26 — endpoint path updated to child-suffix form per ADR-002 UNIQUE scope fix; added ADR-002 as referrer"

  - state: session_token
    status: active
    owner_system: gymsys-backend
    adr: docs/architecture/adr-0006-state-machine-contract.md
    interface: "Backend issues via POST /api/session/claim; client persists user://state.json['session_token']; GymSysClient adds X-Session-Token header on every authenticated call; 401 response → priority-0 force-boot reconciliation (Decision #4)"
    write_access: gymsys-backend-issuer; game-state-machine-persister
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
      - docs/architecture/adr-0002-gymsys-integration-protocol.md  # ratifies POST /api/session/claim endpoint
    added: 2026-05-25
    revised: ""

  - state: _transition_id_counter
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0006-state-machine-contract.md
    interface: "Monotonically-increasing int persisted in user://state.json; portion of transition_id (Contract 2); MUST reuse counter on forward-recovery (NEVER regenerate id)"
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - state: deployment_topology
    status: active
    owner_system: nginx-reverse-proxy
    adr: docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    interface: "Same origin: https://rcprohk.com/ (prod) / http://localhost/ (dev). Routes: /mirror-hero/ → Godot Web Export static; /api/game/ → GymSys FastAPI :9120; / → studiosys web UI :9120. Dev/prod parity via nginx."
    write_access: devops-sprint (nginx config)
    referenced_by:
      - docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
      - docs/architecture/adr-0002-gymsys-integration-protocol.md  # ADR-002 unblocked by this decision
    added: 2026-05-27
    revised: ""

  - state: gymsys_event_cursor
    status: active
    owner_system: gymsys-backend
    adr: docs/architecture/adr-0002-gymsys-integration-protocol.md
    interface: "game_events.id BIGINT AUTOINCREMENT (DB-persistent; NOT in-memory counter — survives server restart). server_epoch_id: server boot unix ms, returned in every poll response. Client stores both; epoch mismatch triggers full resync (cursor invalidated)."
    write_access: gymsys-backend-only
    referenced_by:
      - docs/architecture/adr-0002-gymsys-integration-protocol.md
    added: 2026-05-26
    revised: ""

  - state: canvaslayer_topology
    status: active
    owner_system: master-scene
    adr: docs/architecture/adr-0001-web-export-budget-caps.md
    interface: "GameLayer(0,PAUSABLE) / ParticleLayer(10,PAUSABLE) / HUDLayer(50,PAUSABLE) / ScreenEffectsLayer(100,ALWAYS) [BackBufferCopy + ColorRect ShaderMaterial]; HUD_SHAKES_WITH_WORLD bool knob controls HUDLayer position relative to ScreenEffectsLayer"
    write_access: master-scene-only
    referenced_by:
      - docs/architecture/adr-0001-web-export-budget-caps.md
      - design/gdd/screen-effects-system.md    # consumer — Rule 14 references ADR-0001
      - design/gdd/camera-system.md            # consumer — Camera2D lives in GameLayer(0)
      - design/gdd/particle-system-wrapper.md  # consumer — particles spawn in ParticleLayer(10)
    added: 2026-05-26
    revised: ""

