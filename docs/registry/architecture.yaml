# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: state_changed
    status: active
    pattern: signal
    producer: game-state-machine
    consumers:
      - enemy-director
      - loot-drop-system
      - attention-budget-policy
      - hud
      - telemetry
      - mirror-moment-system
    adr: docs/architecture/adr-0006-state-machine-contract.md
    signal_signature: "state_changed(from_state: String, to_state: String, payload: StateTransitionPayload)"
    initial_state_delivery: "Subscribers obtain initial state via GameStateMachine.connect_for_initial_state(callable: Callable). Helper invokes callable directly via callv([from, to, payload]) — NOT signal.emit() broadcast (Contract 6). Callable MUST accept the standard 3-arg signature and MUST NOT use .bind() extras."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - contract: IPersistence
    status: active
    pattern: interface
    producer: persistence-layer
    consumers:
      - game-state-machine
      - any-system-needing-persistence
    adr: docs/architecture/adr-0006-state-machine-contract.md
    methods: "read() -> Dictionary; write(key: String, value: Variant) -> bool; delete(key: String) -> bool; migrate(from_version: int, to_version: int) -> bool. Test spy interface: attach_write_spy(Callable), attach_delete_spy(Callable), clear_spies()."
    note: "Bounded migration chain — MAX_MIGRATION_CHAIN_LENGTH=10, MIGRATION_BUDGET_MS=500 per step (Contract 10). Authoritative implementation deferred to ADR-003 / GDD #3."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - contract: IInputPolicy
    status: active
    pattern: interface
    producer: attention-budget-policy
    consumers:
      - hud
      - modal
      - all-input-handlers
    adr: docs/architecture/adr-0006-state-machine-contract.md
    methods: "is_input_permitted() -> bool"
    note: "Pillar 2 (Frictionless Companion) architectural enforcement layer. Input handlers accept via constructor injection — NEVER direct reference to AttentionBudgetPolicy (Contract 13). MockInputPolicy used in tests."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - contract: SerializableResource
    status: active
    pattern: base_class
    producer: adr-006
    consumers:
      - any-Resource-payload-crossing-persistence-boundary
    adr: docs/architecture/adr-0006-state-machine-contract.md
    methods: "to_dict() -> Dictionary; static from_dict(data: Dictionary) -> SerializableResource"
    note: "BINDING: any Resource subclass embedded in StateTransitionPayload.data MUST extend this base class. Static analyzer (Contract 12) scans for violations. Examples: BossPayload, StateTransitionPayload, LootPayload."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - contract: nginx_proxy_routes
    status: active
    pattern: reverse_proxy
    producer: nginx
    consumers:
      - godot-game-client    # fetches /api/game/* and /mirror-hero/* via browser
      - studiosys-web-ui     # existing at /
    adr: docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    route_table: "/ → studiosys :9120; /mirror-hero/ → Godot export static /var/www/mirror-hero/; /api/game/ → GymSys FastAPI :9120/api/game/. Custom header forward: proxy_set_header X-Session-Token $http_x_session_token on /api/game/ location."
    note: "Same-origin architecture: zero CORS required. If topology changes, CORS fallback documented in ADR-004 Migration Path. Dev: http://localhost:80 (HTTP). Prod: https://rcprohk.com:443 (TLS, Let's Encrypt)."
    referenced_by:
      - docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    added: 2026-05-27
    revised: ""

  - contract: gymsys_polling_protocol
    status: active
    pattern: http_poll
    producer: gymsys-backend
    consumers:
      - gymsys-backend-client    # #2 GDD — primary consumer
    adr: docs/architecture/adr-0002-gymsys-integration-protocol.md
    endpoint: "GET /api/game/state?last_event_id={N}&server_epoch_id={E}"
    response_format: '{ "server_epoch_id": int, "last_event_id": int, "events": [{"id": int, "type": str, "data": dict}] }'
    note: "Differential event list since last_event_id. 5s±0.5s interval. server_epoch_id mismatch → client full resync. Event types: workout_started / set_logged / rest_started(duration_seconds) / rest_ended / workout_completed."
    referenced_by:
      - docs/architecture/adr-0002-gymsys-integration-protocol.md
    added: 2026-05-26
    revised: ""

  - contract: gymsys_session_api
    status: active
    pattern: http_rest
    producer: gymsys-backend
    consumers:
      - gymsys-backend-client    # #2 GDD
      - game-state-machine       # #1 GSM Decision #4 — session invalidation flow
    adr: docs/architecture/adr-0002-gymsys-integration-protocol.md
    endpoint: "POST /api/session/claim → {session_token, expires_at}; X-Session-Token header on all authenticated requests; 401 → GSM priority-0 force-boot"
    note: "Single-device lock per ADR-006 Decision #4. Session token stored in user://state.json. Renewal: new token in response optional field if near expiry."
    referenced_by:
      - docs/architecture/adr-0002-gymsys-integration-protocol.md
    added: 2026-05-26
    revised: ""

  - contract: gymsys_lootdrop_api
    status: active
    pattern: http_rest
    producer: gymsys-backend
    consumers:
      - game-state-machine       # #1 GSM Rule 5 priorities 0.5/1 + forward-recovery
      - gymsys-backend-client    # #2 GDD — fire-and-forget HTTP write channels
    adr: docs/architecture/adr-0002-gymsys-integration-protocol.md
    endpoints: "POST /api/game/lootdrop/{id}:loot-cache/cache → {pending_since_server}; GET /api/game/lootdrop/{id}:loot-cache/cache → {payload, pending_since_server}; POST /api/game/lootdrop/{id}:loot-commit/commit → {canonical_inventory}"
    note: "Per-table UNIQUE on transition_id (separate lootdrop_cache + lootdrop_commit tables — TD CRITICAL fix). All endpoints idempotent — CONFLICT returns existing row. Retention: cache 37 days (30+7), commit indefinite. Inherits ADR-006 Contract 2 (transition_id UNIQUE) + Contract 15 (pending_since_server authoritative)."
    referenced_by:
      - docs/architecture/adr-0002-gymsys-integration-protocol.md
    added: 2026-05-26
    revised: ""

  - contract: PlatformDetect
    status: active
    pattern: autoload_singleton
    producer: platform-detect-autoload
    consumers:
      - particle-system-wrapper    # reads is_mobile_web for MOBILE_FALLBACK_MULTIPLIER
      - screen-effects-system      # reads is_mobile_web for motion budget tier
      - camera-system              # reads is_mobile_web for smoothing tier
      - any-system-needing-ua-detection
    adr: docs/architecture/adr-0001-web-export-budget-caps.md
    methods: "is_mobile_web: bool (read-only after _ready(); set once via JavaScriptBridge.eval on Web target)"
    note: "BINDING: all systems needing mobile/desktop tier branching MUST read PlatformDetect.is_mobile_web. Direct JavaScriptBridge.eval calls outside platform_detect.gd are FORBIDDEN (CI enforced via check_platform_detect_callers.gd). Autoload position 3 (after Persistence + GSM locked by ADR-0006 C4; before web-export-sensitive autoloads per ADR-0001) — per project.godot ground truth (ADR-0008; corrected from stale 'position 0' 2026-05-29)."
    referenced_by:
      - docs/architecture/adr-0001-web-export-budget-caps.md
    added: 2026-05-26
    revised: ""

  - contract: gymsys_telemetry_api
    status: active
    pattern: http_rest
    producer: gymsys-backend
    consumers:
      - telemetry    # #28 GDD — sole writer (pure observer flush target)
    adr: docs/architecture/adr-0012-telemetry-data-pipeline-privacy.md
    endpoints: "POST /api/game/telemetry (X-Session-Token header) → 200 {accepted, duplicates}; POST /api/game/telemetry/beacon (session_token in BODY — sendBeacon cannot set custom headers) → 204. Batch envelope { session_id, client_batch_id, schema_envelope_version, events[] }."
    note: "First-party-only (same-origin per ADR-0004, relative URL). Backend table game_telemetry with UNIQUE(session_id, client_event_id) = at-least-once idempotent dedup (Q-T6). Retention TELEMETRY_RETENTION_DAYS=180 + player delete-by-account (Q-T7). De-id defense-in-depth: backend rejects out-of-schema payload fields (mirror of client CI-2/CI-3). Opt-out two-layer: client zero-bytes + backend telemetry_opt_out drop (EC-17). Telemetry 401 → keep buffer, NO force-boot (contrast #2 gymsys_session_api 401→force-boot) — pure-observer Rule 1 over the wire."
    referenced_by:
      - docs/architecture/adr-0012-telemetry-data-pipeline-privacy.md
    added: 2026-06-12
    revised: ""

