# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: await_in_state_machine_files
    status: active
    description: "Files matching src/core/state_machine/**.gd MUST NOT contain `await` anywhere in the file (scan-entire-file, not function-scoped). Helper functions are implicitly part of the transition execution graph. HTTPRequest callbacks (e.g., _on_http_request_completed) MUST NOT await either — use call_deferred or process_frame.connect(... CONNECT_ONE_SHOT) for any deferred follow-up."
    why: "Rule 2 transition atomicity requires single-frame execution. Any `await` inside transition execution graph allows engine to yield control mid-transition → subscriber re-entrance + tombstone phantom-state bugs. Contract 12 CI enforcement via `rg --glob 'src/core/state_machine/**/*.gd' '\\bawait\\b'`."
    adr: docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25

  - pattern: object_get_class_for_payload_type
    status: active
    description: "Do not call Object.get_class() or payload.get_class() to obtain a class_name string for serialization tagging. Use payload.get_script().get_global_name() instead."
    why: "Godot 4.6 Object.get_class() returns engine class identifier ('Resource'), NOT the GDScript class_name. Using it for tombstone payload_type tagging causes ALL payloads to serialize as 'Resource' and round-trip to null on forward-recovery, silently breaking Pillar 3 hard guarantee. (Contract 3 — godot-specialist BLOCKING #2)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25

  - pattern: connect_for_initial_state_with_bind
    status: active
    description: "GameStateMachine.connect_for_initial_state(callable) MUST receive a Callable created WITHOUT .bind() extra args. The standard 3-arg signature (from_state, to_state, payload) is mandatory."
    why: "Initial-state delivery uses Callable.callv([from, to, payload]) directly, NOT signal.emit() broadcast. .bind() shifts positional argument layout — callv would mis-deliver the initial state to the subscriber (subscriber sees bound args first instead of from_state). Contract 12 CI scan flags `connect_for_initial_state(*.bind(*))` literal pattern. (Contract 6)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25

  - pattern: transition_id_regeneration_in_forward_recovery
    status: active
    description: "Functions matching `_forward_recover*` name pattern MUST NOT call `_generate_transition_id()`. The tombstone's persisted transition_id field MUST be reused verbatim through Rule 2 step 3-8 replay."
    why: "Backend UNIQUE constraint on transition_id dedupes idempotent retries. If forward-recovery regenerates a new id, server cannot identify the retry as a duplicate of the original committed transition → double LootDrop grant risk. (Contract 2)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25

  - pattern: unserializable_resource_in_payload
    status: active
    description: "Any Resource subclass instance embedded in StateTransitionPayload.data Dictionary MUST extend SerializableResource (override to_dict / from_dict). Plain Resource subclasses are FORBIDDEN at the persistence boundary."
    why: "JSON.stringify(Resource) returns `{}` in Godot 4.6 — embedded Resource is silently lost on tombstone round-trip → forward-recovery payload is null → AC-11a (boss outcome forward-recovery) fails closed. Static analyzer (Contract 12) scans `StateTransitionPayload.data` usage paths and flags Resource subclasses missing the base class. (Contract 3)"
    adr: docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25

  - pattern: raw_javascript_bridge_eval
    status: active
    description: "JavaScriptBridge.eval() must ONLY be called from src/autoload/platform_detect.gd. All other systems read PlatformDetect.is_mobile_web (bool). CI script check_platform_detect_callers.gd greps for JavaScriptBridge outside whitelist."
    why: "Raw JavaScriptBridge.eval scattered across Foundation autoloads makes them untestable on desktop editor (JavaScriptBridge fails on non-Web target → _ready() crash). Single PlatformDetect autoload wraps web-only call behind OS.get_name() guard. TD-ADR ruling: 'wrap, don't sprinkle'."
    adr: docs/architecture/adr-0001-web-export-budget-caps.md
    added: 2026-05-26

  - pattern: loot_rarity_rng_global_randf
    status: active
    description: "loot rarity RNG MUST use `RandomNumberGenerator.new()` with `seed = hash(transition_id)`. Global `randf()` is FORBIDDEN for loot rarity computation."
    why: "Global randf() uses shared random state — results differ on replay/reload (page reload mid-LootDrop produces different tier; forward-recovery re-rolls loot). Seeded RNG on transition_id guarantees same workout_completed event always produces same tier — determinism required by ADR-006 Contract 2 idempotency. (ADR-005 + godot-specialist recommendation)"
    adr: docs/architecture/adr-0005-loot-rarity-formula.md
    added: 2026-05-27

  - pattern: top_rarity_without_workout_signal
    status: active
    description: "No code path in LootDropSystem may produce EPIC or LEGENDARY rarity without workout_score > 0. The formula enforces this mathematically: max_rng_contribution = 0.25 < EPIC_THRESHOLD(0.72), so workout_score ≥ 0.63 required for Epic."
    why: "Pillar 1 (Real Body Real Power) hard constraint from systems-index Anti-Pillar #15. Any code path that bypasses the formula (e.g., debug commands, admin tools, test helpers) that grants top-tier loot without workout_score silently violates Pillar 1. CI: grep for RarityTier.EPIC|LEGENDARY assignments outside LootRarityCalc.compute_rarity(). (ADR-005)"
    adr: docs/architecture/adr-0005-loot-rarity-formula.md
    added: 2026-05-27

  - pattern: absolute_game_api_urls
    status: active
    description: "Godot HTTPRequest calls to /api/game/* MUST use relative URL paths. Absolute URLs with hardcoded domain are FORBIDDEN."
    why: "Absolute URLs (https://rcprohk.com/api/game/...) break development workflow — game served from http://localhost/ cannot make absolute-URL requests to a different dev origin. Relative paths work identically on localhost and production without any config change. Godot specialist confirmed browser fetch() resolves relative URLs against window.location.origin in Web Export. (ADR-004)"
    adr: docs/architecture/adr-0004-cors-cross-origin-auth-topology.md
    added: 2026-05-27

  - pattern: window_local_storage
    status: active
    description: "window.localStorage must NOT be used in any GDScript file. All save state goes through PersistenceLayer autoload (FileAccess / user://). CI script check_local_storage_calls.gd greps for 'window.localStorage' and 'localStorage' outside tests/ and debug/. Also added to technical-preferences.md Forbidden Patterns."
    why: "localStorage has ~5MB quota (vs IndexedDB ~50MB-1GB via user://). localStorage requires JavaScriptBridge (non-idiomatic). Both suffer same 7-day Safari ITP eviction — no quota or durability advantage. Two storage code paths create maintenance burden and inconsistent failure modes. TD-ADR ruling: single code path through PersistenceLayer."
    adr: docs/architecture/adr-0003-save-state-strategy.md
    added: 2026-05-26

