# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: Web
    adr: docs/architecture/adr-0006-state-machine-contract.md
    note: "Web Export (HTML5 / WASM) primary; Godot Compatibility renderer; single-thread WASM (COOP/COEP off — pending Q-A4 VS spike validation)"
    added: 2026-05-25
    revised: ""

  - system: game-state-machine
    status: active
    budget_ms: 1.0
    adr: docs/architecture/adr-0006-state-machine-contract.md
    notes: "Per-transition CPU budget. Includes guard clause, tombstone write, final-state write, in-memory update, signal emit, lock release. Excludes downstream subscriber processing (their own budgets)."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - system: persistence-write-vs-tier
    status: active
    budget_ms: best-effort
    adr: docs/architecture/adr-0006-state-machine-contract.md
    notes: "Contract 11 VS-tier policy: NO IDB-commit fence; FileAccess.store_* return bool indicates WASM-side accept only; ~0.05% per-transition pre-commit loss window accepted. MVP gate at 1/10K threshold via tombstone_write_completed telemetry."
    referenced_by:
      - docs/architecture/adr-0006-state-machine-contract.md
    added: 2026-05-25
    revised: ""

  - system: schema-migration
    status: superseded_by: docs/architecture/adr-0003-save-state-strategy.md
    budget_ms: 5000
    adr: docs/architecture/adr-0006-state-machine-contract.md
    notes: "STALE — ADR-006 draft values (MAX_MIGRATION_CHAIN_LENGTH=10, 500ms/step = 5000ms). Superseded by ADR-003 ratified values below. # was: 5000ms"

  - system: schema-migration-corrected
    status: active
    budget_ms: 900
    adr: docs/architecture/adr-0003-save-state-strategy.md
    notes: "MAX_MIGRATION_CHAIN_LENGTH=6 steps × MIGRATION_BUDGET_MS=150ms/step = 900ms total ceiling. Boot path; not per-frame. Show 'Updating save...' splash past 300ms. Hard abort at step budget exceeded → critical_save_failed → boot to Idle. Supersedes stale schema-migration entry above (was 5000ms from ADR-006 draft)."
    referenced_by:
