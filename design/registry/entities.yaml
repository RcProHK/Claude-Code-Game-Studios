  - name: classify_damage_tier
    status: active
    source: design/gdd/combat-resolver.md
    referenced_by:
      - design/gdd/combat-resolver.md
    variables:
      - damage_dealt                  # int [1, target_hp] — post-clamp from Formula 5
      - target_max_hp                 # int [1, 10000] — from #14 EnemyState
      - is_crit                       # bool — from Formula 2
      - T_CRITICAL                    # float [0.30, 0.60], default 0.40
      - T_HEAVY                       # float [0.10, 0.25], default 0.15
      - T_MEDIUM                      # float [0.03, 0.08], default 0.05
      - T_LIGHT                       # float [0.005, 0.02], default 0.01
    output_range: ["enum DamageTier"] # NEGLIGIBLE / LIGHT / MEDIUM / HEAVY / CRITICAL
    expression: |
      damage_pct = float(damage_dealt) / float(max(1, target_max_hp))
      if damage_pct >= T_CRITICAL: tier = CRITICAL
      elif damage_pct >= T_HEAVY:  tier = HEAVY
      elif damage_pct >= T_MEDIUM: tier = MEDIUM
      elif damage_pct >= T_LIGHT:  tier = LIGHT
      else:                        tier = NEGLIGIBLE
      if is_crit and tier < HEAVY: tier = HEAVY   # crit override per FR Test #4
    notes: "CombatResolver Formula 4 — ratio-of-MAX_HP classification per Q-D4 [B]。Absolute thresholds fail at scale (18 damage on 100 HP mob feels heavy at 18%, same on 5000 HP boss feels negligible at 0.36%)。Crit override forces tier ≥ HEAVY (FR Test #4) preserve crit moment on bullet-sponge boss。Cross-knob invariants: T_CRITICAL > T_HEAVY > T_MEDIUM > T_LIGHT > 0 strict monotonic + T_CRITICAL ≤ 0.60 anti-boss-one-shot。AC-16 + AC-17 + AC-30 verify boundary + crit override + max_hp=1 boundary."
    added: 2026-05-27
    revised: ""

  - name: detect_overkill
    status: active
    source: design/gdd/combat-resolver.md
    referenced_by:
      - design/gdd/combat-resolver.md
    variables:
      - damage_raw                    # float [0, 33750] — from Formula 3
      - target_hp                     # int [0, target_max_hp] — from #14 EnemyState
    output_range: ["Dictionary{damage_dealt, overkill_excess, target_hp_after, is_kill}"]
    expression: |
      damage_int = max(1, roundi(damage_raw))
      return {
        damage_dealt: min(damage_int, target_hp),
        overkill_excess: max(0, damage_int - target_hp),
        target_hp_after: max(0, target_hp - damage_int),
        is_kill: damage_int >= target_hp
      }
    notes: "CombatResolver Formula 5 — Q-D7 [A] clamp damage_dealt at target_hp + expose overkill_excess。Conservation invariant: damage_dealt + target_hp_after == target_hp。Boundary: damage_raw == target_hp → KILLED outcome (NOT OVERKILL); damage_raw == target_hp + 1 → OVERKILL with excess=1。AC-18 + AC-19 + AC-22 (EC-22 exact-kill) verify。"
    added: 2026-05-27
    revised: ""

