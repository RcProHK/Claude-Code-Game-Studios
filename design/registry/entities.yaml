# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: state_changed_signal_signature
    status: active
    source: design/gdd/game-state-machine.md
    referenced_by:
      - design/gdd/game-state-machine.md
      - design/gdd/gymsys-backend-client.md          # #2 — subscribes via connect_for_initial_state per ADR-006 Contract 6
      - design/gdd/workout-state-tracker.md          # #9 — APPROVED 2026-05-27 subscribes via connect_for_initial_state per Section C Rule 12 (ADR-006 Contract 6) for Suspended substate detection
      # Expected future referrers (when their GDDs are written):
      # - design/gdd/persistence-layer.md              (#3)
      # - design/gdd/enemy-director.md                 (#14)
      # - design/gdd/loot-drop-system.md               (#15)
      # - design/gdd/telemetry.md                      (#28)
      # - design/gdd/attention-budget-interaction-policy.md  (#33)
    value: "state_changed(from: String, to: String, payload: StateTransitionPayload)"
    unit: signal_signature
    added: 2026-05-25
    revised: "2026-05-26 — corrected stale value per ADR-006 Contract 6: payload is typed StateTransitionPayload Resource (NOT Dictionary), state args are stable string keys (NOT GameState enum) per Storage Backend stable-key decoupling. Added #2 as referrer."
    notes: "Single fat signal — emitted by GameStateMachine on every successful transition. All subscribers receive from + to + payload. Subscribers MUST use connect_for_initial_state(callable) helper (NOT plain .connect()) per ADR-006 Contract 6 sentinel pattern. Callable MUST NOT use .bind() extras. Payload sentinel detection: payload.source_event == 'initial_state' for initial-state delivery via callv (not signal emit)."

