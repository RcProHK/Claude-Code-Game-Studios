# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: retry_delay
    status: active
    source: design/gdd/game-state-machine.md
    referenced_by:
      - design/gdd/game-state-machine.md
      - design/gdd/gymsys-backend-client.md   # #2 — executes the sleep in Backoff substate per Rule 12 retry matrix
    variables:
      - n              # attempt index, 1-indexed, resets to 1 on success
      - BASE_DELAY     # tuning knob, default 1.0s
      - RETRY_CAP      # tuning knob, default 16.0s
    output_range: [0.5, 60.0]   # [min BASE_DELAY, max RETRY_CAP] across safe ranges
    expression: "min(BASE_DELAY * pow(2, n - 1), RETRY_CAP)"
    notes: "Exponential backoff with cap for GymSys reconnection from Disconnected state. Ownership: GameStateMachine (decides when to transition back from Disconnected). Execution: GymSys Backend Client (does actual sleep per Rule 12 retry matrix). Defaults: BASE_DELAY=1.0, RETRY_CAP=16.0 → 1,2,4,8,16,16,... seconds."
    added: 2026-05-25
    revised: "2026-05-26 — added GymSys Backend Client (#2) as referrer (executes the sleep)"

  - name: actual_poll_interval
    status: active
    source: design/gdd/gymsys-backend-client.md
    referenced_by:
      - design/gdd/gymsys-backend-client.md
      # Expected future referrers: none directly — output is internal to #2
    variables:
      - GYMSYS_POLL_INTERVAL_SECONDS   # locked at 5.0 from game-concept
      - POLL_JITTER_SECONDS            # tuning knob, default 0.5s, safe range [0.0, 0.5]
    output_range: [4.5, 5.5]           # at defaults; bounded by jitter amplitude
    expression: "GYMSYS_POLL_INTERVAL_SECONDS + randf_range(-POLL_JITTER_SECONDS, +POLL_JITTER_SECONDS)"
    notes: "Polling jitter for thundering-herd avoidance. Spreads multi-client poll requests across the 5s window so backend P95 latency stays smooth instead of spiking at wall-clock tick boundaries. Cross-knob invariant: GYMSYS_POLL_INTERVAL_SECONDS - POLL_JITTER_SECONDS ≥ POLL_TIMEOUT_SECONDS + 0.5 (preserves single-flight margin)."
    added: 2026-05-26
    revised: ""

  - name: is_expired
    status: active
    source: design/gdd/persistence-layer.md
    referenced_by:
      - design/gdd/persistence-layer.md
      - design/gdd/gymsys-backend-client.md   # #2 — 35-day _committed_tombstones age-pruning (Rule 15)
      - design/gdd/game-state-machine.md      # #1 — _last_weekly_tick_unix + pending_transition TTL checks
      # Expected future referrers:
      # - design/gdd/streak-system.md          (#8 — daily-window check)
    variables:
      - anchor_unix                # caller-provided Unix timestamp at anchor event
      - ttl_seconds                # caller-provided max age before expiry
      - anchor_monotonic_ms        # optional Time.get_ticks_msec() at anchor; enables drift detection
      - WALL_CLOCK_DRIFT_TOLERANCE_SECONDS  # PersistenceLayer-owned knob, default 300s
    output_range: [false, true]    # boolean
    expression: |
      var wall_delta = Time.get_unix_time_from_system() - anchor_unix
      if anchor_monotonic_ms > 0:
          var mono_delta_sec = (Time.get_ticks_msec() - anchor_monotonic_ms) / 1000
          if abs(wall_delta - mono_delta_sec) > WALL_CLOCK_DRIFT_TOLERANCE_SECONDS:
              return mono_delta_sec > ttl_seconds   # trust monotonic
      return wall_delta > ttl_seconds
    notes: "Drift-tolerant TTL expiry check per ADR-006 Contract 9. Pure function (no state mutation). Caller provides anchors + ttl; helper handles NTP/DST/manual-clock-change detection via monotonic fallback. Defaults: WALL_CLOCK_DRIFT_TOLERANCE_SECONDS=300 (safe 60..3600). At default, normal NTP second-tick jitter (~1-30s) doesn't trigger false drift; real DST/NTP corrections (>5min) do."
    added: 2026-05-26
    revised: ""

  - name: final_count_composition
    status: active
    source: design/gdd/particle-system-wrapper.md
    referenced_by:
      - design/gdd/particle-system-wrapper.md
      # Expected future referrers:
      # - docs/architecture/adr-0001-godot-web-export-budget-caps.md  (input scope — ratifies cap value)
      # - design/gdd/loot-drop-system.md  (#15 — LOOT preset mapping affects loot_mult input)
      # - design/gdd/enemy-director.md    (#14 — caller_mult usage discipline)
      # - design/gdd/loot-drop-modal.md   (#21 — caller_mult usage discipline)
      # - design/gdd/combat-visual-feedback.md  (#25 — caller_mult usage discipline)
    variables:
      - preset.count               # base from PRESET_TABLE per Rule 13 (int [4, 48])
      - loot_mult                  # {1.0, 3.0} — 3.0 if preset_id ∈ {LOOT_BURST, LOOT_RARE_BURST}
      - mobile_mult                # {0.5, 1.0} — 0.5 if _is_mobile == true
      - caller_mult                # [0.1, 1.5] — Rule 1 caller validation pre-clamps
    output_range: [1, 256]         # integer; clamp floor 1 (never emit 0), ceiling 256 (LARGE tier amount buffer)
    expression: "clamp(round(preset.count × loot_mult × mobile_mult × caller_mult), 1, 256)"
    notes: "Multiplier composition formula per Rule 7 (LOCKED apply order: preset → loot → mobile → caller → round → clamp). Pillar 3 sanity check invariant: desktop LOOT/HIT ratio = 9× (LOOT_BURST 72 ÷ HIT_LIGHT 8 = 9.0), maintained at mobile same ratio. ceiling clamp triggers `push_warning` (design-time signal). Floor clamp guarantees minimum visible burst per Pillar 3 feedback invariant."
    added: 2026-05-26
    revised: ""

  - name: shake_offset_per_frame
    status: active
    source: design/gdd/screen-effects-system.md
    referenced_by:
      - design/gdd/screen-effects-system.md
      # Expected future referrers:
      # - docs/architecture/adr-0001-godot-web-export-budget-caps.md  (FR-1 ratification — CPU budget binding)
    variables:
      - trauma                     # float [0.0, 1.0] — accumulated trauma (Formula 2 output)
      - MAX_OFFSET_PX              # tuning knob, default 4.0px, safe [2.0, 8.0]
      - noise_sample               # Vector2 each axis [-1, 1] — Formula 4 cheap deterministic hash
      - trauma_decay_rate          # float [2.0, 100.0] /sec — Formula 2 output
      - delta                      # float [0, MAX_FRAME_DELTA=0.1] sec — Rule 13 bfcache clamp
      - time                       # float [0, ∞) sec — engine elapsed time
    output_range: [-4.0, 4.0]     # each axis (Vector2); worst case ±MAX_OFFSET_PX at trauma=1.0
    expression: "pow(trauma, 2) × MAX_OFFSET_PX × noise_sample(time); trauma = max(0.0, trauma - trauma_decay_rate × delta) per frame"
    notes: "Yoshi/Vlachos GDC trauma² decay model — front-loaded energy curve delivers 'solid impact, not motor vibration' feel (Pillar 1 體感 channel)。Trauma < TRAUMA_EPSILON (0.01) short-circuits evaluation (AC-D5)。motion_intensity = 0.0 → entire pipeline bypassed (Section B Falsifiable Test #2 binding — hit_pause 仍然 fire per Rule 7)。"
    added: 2026-05-26
    revised: ""

  - name: trauma_combiner
    status: active
    source: design/gdd/screen-effects-system.md
    referenced_by:
      - design/gdd/screen-effects-system.md
      # Expected future referrers:
      # - design/gdd/enemy-director.md  (#14 — direct caller path shake(intensity, duration))
      # - design/gdd/combat-visual-feedback.md  (#25 — direct caller path for parry counter-shake)
    variables:
      - trauma_old                 # float [0.0, 1.0] — pre-call trauma state
      - raw_intensity              # float [0.0, 1.0] — Rule 1 caller intensity input
      - motion_intensity           # float [0.0, 1.0] — Rule 3 a11y slider input
      - duration                   # float [0.0, 0.5] sec — Rule 1 caller duration input
      - MIN_SHAKE_DURATION         # tuning knob, default 0.01s, safe [0.005, 0.05]
      - trauma_decay_rate_old      # float [2.0, 100.0] /sec
    output_range: [0.0, 1.0]      # trauma_new bounded [0,1]; decay_rate_new bounded [2.0, 100.0] /sec
    expression: "trauma_new = min(1.0, trauma_old + raw_intensity × motion_intensity); trauma_decay_rate_new = max(trauma_decay_rate_old, 1.0 / max(MIN_SHAKE_DURATION, duration))"
    notes: "Additive trauma combiner with hard clamp (Rule 5) + input-side motion_intensity (Rule 7) + MIN_SHAKE_DURATION denominator floor amendment (Formula 2 div-by-zero safety net)。Falsifiable Test #4 binding (AC-D1): 8 × HIT_HEAVY (0.4 each) saturates to 1.0, clamp holds — shader uniform offset 絕對唔超出 MAX_OFFSET_PX。Decay monotonicity invariant (AC-D4): decay_rate_new ≥ decay_rate_old 永遠成立。"
    added: 2026-05-26
    revised: ""

  - name: pause_max_remaining
    status: active
    source: design/gdd/screen-effects-system.md
    referenced_by:
      - design/gdd/screen-effects-system.md
      # Expected future referrers:
      # - design/gdd/enemy-director.md (#14 — direct caller path hit_pause(duration))
      # - design/gdd/combat-visual-feedback.md (#25 — direct caller path)
    variables:
      - pause_remaining_old        # float [0.0, MAX_PAUSE_SEC] sec
      - requested_duration         # float [0.0, ∞) sec — Rule 2 clamps before reaching formula
      - MAX_PAUSE_SEC              # tuning knob, default 0.12s, safe [0.04, 0.12]
    output_range: [0.0, 0.12]     # hard-clamped to MAX_PAUSE_SEC
    expression: "pause_remaining_new = min(MAX_PAUSE_SEC, max(pause_remaining_old, requested_duration))"
    notes: "Max-remaining combiner (Rule 8) — overlapping hit_pause calls 唔 stack, 強者 wins。Pillar 2 user-detectable freeze threshold (0.125s reaction safety margin) → 0.12s hard ceiling 留 5ms buffer。hit_pause NOT multiplied by motion_intensity (Rule 7 + Section B locked: time perturbation ≠ vestibular trigger)。Requested duration > MAX_PAUSE_SEC clamps + push_warning (AC-D3)。"
    added: 2026-05-26
    revised: ""

  - name: follow_position_after_smoothing
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
      # Expected future referrers:
      # - docs/architecture/adr-0001-godot-web-export-budget-caps.md (FR-1 ratification — Camera CPU budget binding)
    variables:
      - pos_old                    # Vector2 (px) — previous frame Camera2D position
      - target                     # Vector2 (px) — follow target world position (dead-zone clamped)
      - POSITION_SMOOTHING_SPEED   # tuning knob, default 5.0, safe [3.0, 8.0]
      - delta                      # float [0, MAX_FRAME_DELTA=0.1] sec — frame delta
    output_range: ["asymptotic", "asymptotic"]   # Vector2 each axis, asymptotically converges to target; dead-zone box bounds
    expression: "pos_new = pos_old + (target - pos_old) × (1 - exp(-POSITION_SMOOTHING_SPEED × delta))"
    notes: "Godot 4.6 Camera2D built-in exponential decay (frame-rate independent post-4.4 fix)。Settle math: t to 63% = 1/k, t to 95% = 3/k。At default k=5.0: 200ms → 63%, 600ms → 95%。Pillar 2 lock-on metric: settle-to-within-3px ≤ 500ms (Formula 4 derivation, 461ms @ 30px offset)。AC-09 + AC-30 binding。"
    added: 2026-05-26
    revised: ""

  - name: quart_ease_out_value
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    variables:
      - t                          # float [0.0, 1.0] — normalized tween time
      - start                      # Vector2 / float — value at t=0
      - end                        # Vector2 / float — value at t=1
      - FOCAL_ENTRY_DURATION       # tuning knob, default 0.6s, safe [0.4, 1.0]
    output_range: ["bounded by [start, end]"]   # monotonic increasing, never overshoots
    expression: "value(t) = start + (end - start) × (1 - pow(1 - t, 4))"
    notes: "Focal entry interpolation (Rule 6) — quart ease-out front-loaded: at t=0.3, covers 76% of distance (Section B Falsifiable Test #5 「decisive invitation」 property)。Quart over cubic: cubic only 65.7% in 30% time → weaker lunge perception；quart matches DNF Otherverse portal push-in snappiness。AC-11 binding。"
    added: 2026-05-26
    revised: ""

  - name: cubic_ease_in_out_value
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    variables:
      - t                          # float [0.0, 1.0] — normalized tween time
      - start                      # Vector2 / float — Focal-state value
      - end                        # Vector2 / float — Resume-state value
      - FOCAL_EXIT_DURATION        # tuning knob, default 0.5s, safe [0.3, 0.8]
    output_range: ["bounded by [start, end]"]   # symmetric around t=0.5, never overshoots
    expression: "value(t) = start + (end - start) × f(t); f(t) = 4t³ if t<0.5 else 1 - pow(-2t+2,3)/2"
