      # Expected future referrers:
      # - design/gdd/gymsys-backend-client.md  (#2 — provides backend_pending Set via /api/game/loot/pending)
      # - docs/architecture/adr-0003-save-state-strategy.md  (loot.pending namespace reconciliation pattern)
    variables:
      - local_pending     # Set[transition_id] — client IndexedDB unrevealed
      - local_revealed    # Set[transition_id] — client revealed but not server-ACKed
      - backend_pending   # Set[transition_id] — server authoritative
    output_range: 3 disjoint Sets {to_enqueue, to_ack_only, to_discard_local}
    expression: |
      to_enqueue       = backend_pending - (local_pending ∪ local_revealed)
      to_ack_only      = backend_pending ∩ local_revealed
      to_discard_local = local_pending - backend_pending
      assert pairwise disjoint
    notes: "Formula 5 — bfcache resume reconciliation Set algebra。CF-4: 3 outputs pairwise disjoint (assert enforced)。Rule 17 + EC-20 binding。CI-4: backend_pending 必來自 GymSys /api/game/loot/pending (ADR-0002 differential cursor)。Resolves systems-designer's identified tension between local-revealed-but-backend-no-record case (silent discard, backend already ACKed earlier)。AC-09 worked 4-entry example + AC-31 composite end-to-end verify。"
