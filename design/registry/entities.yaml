    expression: "boss_pre_spawn_trigger = (_boss_anchor_state == IDLE AND current_set == final_planned_set AND set_progress >= PRE_SPAWN_THRESHOLD); fallback path uses reps_completed_in_set >= ceil(planned_reps × PRE_SPAWN_FALLBACK_REPS_FRAC) if set_progress not exposed"
    notes: "EnemyDirector Formula 5 — boss anchor predictive pre-spawn (Rule 13 + FR-2 binding)。set_progress > 0.8 表示 final 20% reps emotional climax window — pre-spawn 預備 visible reveal 避免 workout_completed event arrival 嗰陣先 instantiate 引發 frame spike。Latency budget ≤ 500ms p95 (Falsifiable Test #2; #9 GDD APPROVED 2026-05-27 — AC-26/AC-41 verifies)。EC-15 rollback path / EC-16 emergency fallback / EC-19 light-workout mini-boss covered。"
