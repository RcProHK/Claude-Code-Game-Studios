  - name: set_progress_derivation
    status: active
    source: design/gdd/workout-state-tracker.md
    referenced_by:
      - design/gdd/workout-state-tracker.md
      - design/gdd/enemy-director.md      # #14 — Rule 13 boss anchor pre-spawn trigger reads set_progress >= 0.8
      # Expected future referrers:
      # - design/gdd/gym-mode-hud.md       (#20 — display set progress bar)
    variables:
      - current_set_index          # int [1, ∞) — count of set_logged events
      - reps_completed_in_set      # int [0, planned_reps_in_current_set]
      - planned_reps_in_current_set  # int [1, ∞) — GymSys provides (full-data path) OR effective_planned_reps fallback
      - planned_total_sets         # int [1, ∞) — GymSys provides (full-data path) OR effective_planned_total fallback
      - historical_avg_sets        # float [1.0, ∞) — EWMA from wst.history.avg_sets
      - historical_avg_reps_per_set  # float [1.0, ∞) — EWMA from wst.history.avg_reps_per_set
      - previous_set_progress      # float [0.0, 1.0] — monotonic clamp anchor
    output_range: [0.0, 1.0]
    expression: |
      # Full-data path (preferred; needs ADR-002-EXTENSION-GATED signal for planned_total_sets + rep_logged):
      set_progress_raw = clamp((current_set_index - 1 + reps_completed_in_set / planned_reps_in_current_set) / planned_total_sets, 0.0, 1.0)
      # Estimated fallback path (current default):
      set_progress_raw = clamp((current_set_index - 1 + reps_completed_in_set / max(1, round(historical_avg_reps_per_set))) / max(current_set_index + 1, historical_avg_sets), 0.0, 1.0)
      # Monotonic clamp (both paths):
      set_progress = max(set_progress_raw, previous_set_progress)
    notes: "Workout State Tracker Formula 1 — centerpiece for #14 boss anchor pre-spawn (CI-1 binding at pre_spawn_threshold=0.8). Two paths: full-data (Q-X1-gated GymSys signal extension) and estimated fallback (default). Monotonicity invariant (CF-1) enforced. Pillar 1 compliance: no time-based extrapolation, no interpolation, all inputs from real set_logged events. CI-2: when set_progress unreliable (is_estimated=true), #14 fallback to reps_completed >= ceil(planned × 0.5) heuristic. WorkoutSnapshotRO.set_progress_is_estimated bool exposes reliability flag."
    added: 2026-05-27
    revised: ""

  - name: dominant_class_derivation
    status: active
    source: design/gdd/workout-state-tracker.md
    referenced_by:
      - design/gdd/workout-state-tracker.md
      - design/gdd/enemy-director.md      # #14 — Rule 12 wave archetype selection reads get_dominant_ability_class()
      - design/gdd/stat-system.md         # #11 — VOLUME_TICK class routing per Section C Rule 13 (#9 calls Stat.apply_stat_delta with class-derived stat_id)
      # Expected future referrers:
      # - design/gdd/exercise-class-mapping.md  (#10 — provides classify() input map; Pre-MVP)
    variables:
      - set_history                # Array[Dictionary{exercise_id, reps, weight, logged_at}]
      - exercise_class_map         # Dictionary[StringName, AbilityClass] — from #10 stub OR full mapping
      - set_counts                 # Dictionary[AbilityClass, int] — per-class tally
      - leaders                    # Array[AbilityClass] — tie set
      - previous_dominant_class    # AbilityClass | null — sticky-last-leader anchor
    output_range: ["AbilityClass enum: STRIKE | CONTROL | MOBILITY | UNKNOWN"]
    expression: |
      set_counts[c] = |{s in set_history : exercise_class_map[s.exercise_id] == c}|
      leaders = {c : set_counts[c] == max(set_counts.values()) AND set_counts[c] > 0}
      # Decision tree:
      # 1. empty/all-zero → UNKNOWN
      # 2. single leader → return leader, update previous_dominant_class
      # 3. tie (>1 leader) → walk set_history reverse-chronologically, find last solo leader
      # 4. tiebreak walk failed → return previous_dominant_class (sticky); else UNKNOWN
    notes: "Workout State Tracker Formula 3 — Pillar 4 substrate (Muscle = Class). Set-count weighted (game-designer Q1 — rejected volume-weighted due to heavy-compound bias against Falsifiable Test #1 A-vs-B blind playtest). Sticky-last-leader tiebreak avoids mid-workout flicker. #9 NEVER fabricates STRIKE fallback when UNKNOWN — that's #14 EnemyDirector EC-09 responsibility (CI-3). UNKNOWN exercises (not in #10 map) skip tally entirely. AC-18 worked example: 3 STRIKE + 3 CONTROL + 2 MOBILITY → tiebreak walk returns STRIKE per set #6 solo leader."
