  - name: apply_tier_ceiling_floor
    status: active
    source: design/gdd/loot-drop-system.md
    referenced_by:
      - design/gdd/loot-drop-system.md
      # Expected future referrers:
      # - design/gdd/boss-system.md       (#16 — final boss floor + mini-boss ceiling enforcement reciprocal)
      # - design/gdd/equipment-inventory.md  (#17 — receives final_tier post-clamp)
      # - design/gdd/telemetry.md         (#28 — clamp telemetry events `loot.tier.clamp_mini`)
    variables:
      - raw_tier              # enum RarityTier from ADR-0005 output
      - kind                  # enum SourceEventKind {WORKOUT_DAILY, MINI_BOSS, FINAL_BOSS}
      - ws                    # float workout_score [0.0, 1.0]
    output_range: enum RarityTier {COMMON, UNCOMMON, RARE, EPIC, LEGENDARY}
    expression: |
      apply_tier_ceiling_floor(raw_tier, kind, ws) =
        if ws == 0.0                       → COMMON                                  # Rule 8 zero-workout guard
        elif kind == FINAL_BOSS            → max(raw_tier, UNCOMMON)                  # Rule 5 final boss floor
        elif kind == MINI_BOSS             → min(max(raw_tier, COMMON), RARE)        # Rule 4 mini ceiling + ADR-0005 Pillar 3 floor
        else (kind == WORKOUT_DAILY)       → max(raw_tier, COMMON)                    # ADR-0005 Pillar 3 floor
    notes: "Formula 1 — #15-owned source-event clamp wrapping ADR-0005 raw_tier output。Logic order strict: zero-workout → COMMON floor → source-event clamp。INV-10: mini ≤ RARE / final ≥ UNCOMMON。INV-11: ws=0 → COMMON forced (Pillar 1 anti-fabrication fallback)。CI-1: raw_tier 必由 ADR-0005 produce，#15 不可 re-derive。AC-03/04/05 verify。"
    added: 2026-05-28
    revised: ""

  - name: reconcile_local_vs_backend
    status: active
    source: design/gdd/loot-drop-system.md
    referenced_by:
